<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="far" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="322">
      <stop offset="0" stop-color="#aebcc6" stop-opacity="0"/>
      <stop offset=".4" stop-color="#aebcc6" stop-opacity=".38"/>
      <stop offset="1" stop-color="#a4b3be" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="mid" gradientUnits="userSpaceOnUse" x1="0" y1="110" x2="0" y2="322">
      <stop offset="0" stop-color="#8597a6" stop-opacity=".14"/>
      <stop offset=".55" stop-color="#8597a6" stop-opacity=".5"/>
      <stop offset="1" stop-color="#7b8e9c" stop-opacity=".62"/>
    </linearGradient>
    <linearGradient id="warm" gradientUnits="userSpaceOnUse" x1="0" y1="190" x2="0" y2="322">
      <stop offset="0" stop-color="#bda98d" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ad9a80" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="gr" gradientUnits="userSpaceOnUse" x1="0" y1="296" x2="0" y2="360">
      <stop offset="0" stop-color="#9aa98f" stop-opacity=".52"/>
      <stop offset=".5" stop-color="#a9b39b" stop-opacity=".3"/>
      <stop offset="1" stop-color="#b8b7a4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tree" gradientUnits="userSpaceOnUse" x1="0" y1="262" x2="0" y2="330">
      <stop offset="0" stop-color="#8ea48b" stop-opacity=".42"/>
      <stop offset="1" stop-color="#6f8670" stop-opacity=".6"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e8d8bb" stop-opacity=".42"/>
      <stop offset=".6" stop-color="#e8d8bb" stop-opacity=".14"/>
      <stop offset="1" stop-color="#e8d8bb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#c8d6de" stop-opacity=".34"/>
      <stop offset="1" stop-color="#c8d6de" stop-opacity="0"/>
    </radialGradient>
    <filter id="haze" x="-4%" y="-12%" width="108%" height="124%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <!-- low-sky warmth echoing the Earth's limb -->
  <ellipse cx="540" cy="300" rx="840" ry="150" fill="url(#glow)"/>
  <ellipse cx="1480" cy="290" rx="520" ry="120" fill="url(#cool)"/>

  <!-- far hazy masses -->
  <path filter="url(#haze)" fill="url(#far)" stroke="url(#far)" stroke-width="14" stroke-linejoin="round"
    d="M0 "/>

  <!-- middle architectural masses -->
  <g fill="url(#mid)">
    <rect x="0" y="218" width="58" height="104" rx="5"/>
    <rect x="66" y="118" width="36" height="204" rx="6"/>
    <rect x="108" y="192" width="84" height="130" rx="6"/>
    <rect x="128" y="172" width="40" height="26" rx="4"/>
    <rect x="300" y="212" width="82" height="110" rx="6"/>
    <rect x="326" y="184" width="32" height="34" rx="4"/>
    <rect x="1296" y="160" width="62" height="162" rx="6"/>
    <rect x="1366" y="222" width="84" height="100" rx="6"/>
    <rect x="1476" y="202" width="124" height="120" rx="6"/>
    <rect x="1536" y="168" width="64" height="40" rx="5"/>
  </g>
  <g fill="url(#warm)">
    <rect x="560" y="250" width="200" height="72" rx="8"/>
    <rect x="688" y="196" width="26" height="62" rx="4"/>
    <rect x="683" y="191" width="36" height="7" rx="3"/>
    <rect x="1000" y="246" width="124" height="76" rx="8"/>
    <path d="M1024 248a38 38 0 0 1 76 0Z"/>
    <rect x="1058" y="198" width="8" height="14" rx="2"/>
  </g>

  <!-- urban details: mast, bridge, sparse window light -->
  <g stroke="#7f93a2" stroke-linecap="round" fill="none">
    <path d="M84 118V96" stroke-width="2" opacity=".6"/>
    <circle cx="84" cy="95" r="2.4" fill="#7f93a2" stroke="none" opacity=".55"/>
    <path d="M790 288H1002" stroke-width="3" opacity=".5"/>
    <path d="M800 302q24-28 48 0q24-28 48 0q24-28 48 0q24-28 48 0" stroke-width="2" opacity=".48"/>
    <path d="M78 150v7M90 164v7M82 188v7M92 212v7M80 240v7M90 266v7M130 220v6M166 236v6M150 262v6M340 232v6M362 250v6M1316 190v7M1336 210v7M1322 236v7M1340 262v7M1398 246v6M1424 268v6M1510 230v6M1560 250v6M1580 224v6" stroke-width="2" opacity=".3"/>
  </g>

  <!-- rolling parkland fading into the page -->
  <path fill="url(#gr)" d="M0 360V308C120 296 220 318 340 306C470 294 560 316 700 308C830 301 900 320 1010 310C1130 300 1210 320 1330 308C1440 297 1520 314 1600 304V360Z"/>

  <!-- greenery: soft canopies, mostly in the margins -->
  <g fill="url(#tree)">
    <ellipse cx="42" cy="302" rx="22" ry="20"/>
    <ellipse cx="82" cy="290" rx="30" ry="27"/>
    <ellipse cx="128" cy="300" rx="20" ry="18"/>
    <ellipse cx="176" cy="294" rx="26" ry="23"/>
    <ellipse cx="222" cy="306" rx="16" ry="15"/>
    <ellipse cx="470" cy="306" rx="15" ry="14"/>
    <ellipse cx="512" cy="300" rx="21" ry="19"/>
    <ellipse cx="586" cy="308" rx="13" ry="12"/>
    <ellipse cx="850" cy="310" rx="16" ry="15"/>
    <ellipse cx="896" cy="302" rx="23" ry="21"/>
    <ellipse cx="1236" cy="304" rx="19" ry="18"/>
    <ellipse cx="1398" cy="296" rx="27" ry="25"/>
    <ellipse cx="1446" cy="306" rx="17" ry="16"/>
    <ellipse cx="1524" cy="292" rx="31" ry="28"/>
    <ellipse cx="1574" cy="302" rx="20" ry="19"/>
  </g>
  <path d="M82 316v10M176 316v10M512 318v8M896 322v6M1398 320v8M1524 318v10" stroke="#6e7f6b" stroke-width="2" stroke-linecap="round" opacity=".45"/>
</svg>
