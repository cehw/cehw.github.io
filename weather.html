    <script>
      (() => {
        try {
          const query = new URLSearchParams(location.search).get("theme");
          const saved = query === "dark" || query === "light" ? query : localStorage.getItem("site-theme");
          document.documentElement.setAttribute("data-theme", saved === "light" ? "light" : "dark");
        } catch (_) { document.documentElement.setAttribute("data-theme", "dark"); }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

          <a href="https://www.hko.gov.hk/en/wxinfo/currwx/flw.htm">Hong Kong Observatory forecast</a>.</p></noscript>
